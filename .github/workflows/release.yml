name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: Windows-x64
            runner: windows-2022
            cmake_arch: x64
            vcpkg_triplet: x64-windows
            qt_arch: win64_msvc2022_64
            qt_version: 6.8.0
            experimental: false
          - suffix: Windows-arm64
            runner: windows-2022
            cmake_arch: ARM64
            vcpkg_triplet: arm64-windows
            qt_arch: win64_msvc2022_arm64_cross_compiled
            qt_version: 6.8.0
            experimental: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: "windows"
          target: "desktop"
          arch: ${{ matrix.qt_arch }}

      - name: Add Qt tools to PATH
        shell: pwsh
        run: |
          if ($env:QT_ROOT_DIR -and (Test-Path "$env:QT_ROOT_DIR\bin")) {
            "$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-b02e341c927f16d991edbd915d8ea43eac52096c-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "b02e341c927f16d991edbd915d8ea43eac52096c"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package app directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_pkg -Force
          Copy-Item build\Release\Sudoku_demo.exe release_pkg\
          Copy-Item build\Release\Character_Sample release_pkg\ -Recurse
          Copy-Item build\Release\OCR_Model release_pkg\ -Recurse
          Copy-Item build\Release\Sudoku_Sample release_pkg\ -Recurse
          if (Test-Path "build\Release\*.dll") {
            Copy-Item build\Release\*.dll release_pkg\
          }
          windeployqt --release --compiler-runtime --dir release_pkg release_pkg\Sudoku_demo.exe

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Rename installer
        shell: pwsh
        run: |
          Rename-Item Sudoku_demo_Setup.exe Sudoku_Demo-${{ matrix.suffix }}-Setup.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Sudoku_Demo-${{ matrix.suffix }}-Setup.exe

  macos-dmg:
    name: macOS DMG (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            suffix: macOS-x64
            cmake_architectures: x86_64
            vcpkg_triplet: x64-osx
            experimental: false
          - name: Apple-Silicon
            runner: macos-14
            suffix: macOS-arm64
            cmake_architectures: arm64
            vcpkg_triplet: arm64-osx
            experimental: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          host: "mac"
          target: "desktop"

      - name: Add Qt tools to PATH
        shell: bash
        run: |
          if [ -n "$QT_ROOT_DIR" ] && [ -d "$QT_ROOT_DIR/bin" ]; then
            echo "$QT_ROOT_DIR/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-b02e341c927f16d991edbd915d8ea43eac52096c-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "b02e341c927f16d991edbd915d8ea43eac52096c"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_architectures }}" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Build DMG
        shell: bash
        run: |
          macdeployqt build/Sudoku_demo.app -dmg
          DMG_PATH="$(find . -maxdepth 3 -name 'Sudoku_demo.dmg' -print -quit)"
          test -n "$DMG_PATH"
          mv "$DMG_PATH" "Sudoku_Demo-${{ matrix.suffix }}.dmg"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Sudoku_Demo-${{ matrix.suffix }}.dmg
